spring:
  datasource:
    hikari:
      # Small on purpose. Every cached Spring context holds its own pool for the whole test run,
      # and they all point at one PostgreSQL container: at the production pool size, the eighth
      # context fails to start with "sorry, too many clients already". Nothing here is throughput
      # bound.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      # Still 'validate' in tests: a mismatch between a migration and an entity mapping should
      # break the build, not be papered over by Hibernate creating the schema itself.
      ddl-auto: validate
    show-sql: false

  kafka:
    producer:
      # Tests publish hand-written JSON strings rather than serializing a shared class. That
      # exercises the real wire format — field names, date encoding, enum spelling — instead of
      # letting a producer and consumer that share a class agree with each other by construction.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      auto-offset-reset: earliest

  data:
    redis:
      # Deliberately not the production 500ms. That value exists so a live service degrades rather
      # than parks a request thread on an unreachable cache, and it is the right production choice.
      # In a test it is a race: a cold Lettuce connection to a container on a loaded CI runner can
      # take longer than that, the cache error handler swallows the failure exactly as designed, and
      # a test asserting cache behaviour then fails with a counter that never moved. Tests that
      # assert the degraded path pin their own short timeouts instead — see
      # ShipmentCacheUnavailableIntegrationTest.
      timeout: 5s
      connect-timeout: 5s

parcelflow:
  kafka:
    # Single-broker Redpanda container: a replication factor above 1 cannot be satisfied.
    partitions: 1
    replication-factor: 1
  cache:
    # Off by default so most tests need no Redis container — and, more usefully, so the whole suite
    # doubles as the proof that the service is correct with the cache disabled. Tests that assert
    # caching behaviour turn it back on and start a Redis container.
    enabled: false
  processing:
    max-optimistic-lock-retries: 3
    # Short backoff so DLT tests do not spend five seconds waiting for a retry budget to drain.
    max-kafka-retries: 2
    retry-initial-backoff: 50ms
    retry-backoff-multiplier: 2.0
    retry-max-backoff: 200ms
    shipment-cache-ttl: 1m

management:
  health:
    redis:
      # Nothing to reach when the cache is disabled.
      enabled: false

logging:
  level:
    ca.vm.parcelflow: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.apache.kafka.clients: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
    kafka: WARN
    # The DLT tests deliberately provoke failures; the container logs each one at error level.
    org.springframework.kafka.listener.DefaultErrorHandler: OFF
    org.springframework.kafka.listener.DeadLetterPublishingRecoverer: TRACE
