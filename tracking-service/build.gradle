plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'ParcelFlow tracking service: shipment API and carrier event processor'

ext {
    springdocVersion = '3.1.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Flyway 10+ ships database support in per-vendor modules.
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Tracing, without a tracing backend. The bridge gives every unit of work a trace id and a
    // span id, propagates them across the HTTP and Kafka boundaries in W3C headers, and puts them
    // in the logging context so a JSON log line carries them as fields. No exporter is configured,
    // so spans are created and dropped: the value here is correlation in the logs, and adding an
    // OTLP exporter plus a Tempo or Zipkin container is a dependency and a Compose service away.
    // Honest about what this is — trace context propagation, not a trace viewer.
    //
    // Two coordinates, and both are needed. Spring Boot 4 split its auto-configuration into
    // per-technology modules: spring-boot-micrometer-tracing-brave is the wiring and brings no
    // Brave, micrometer-tracing-bridge-brave is Brave and brings no wiring. Either one alone
    // produces a build that looks like it has tracing and silently has none — observations still
    // work, so the Kafka listener timer appears and nothing complains, but no span is ever created
    // and no trace id reaches the logging context.
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4 moved MockMvc test auto-configuration out of spring-boot-test-autoconfigure
    // into a per-stack module.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-redpanda'
    // Testcontainers 2.x has no Redis module; Redis runs as a GenericContainer, which Boot's
    // RedisContainerConnectionDetailsFactory accepts.
    testImplementation 'org.testcontainers:testcontainers'
    // Bounded polling for asynchronous assertions; no Thread.sleep in integration tests.
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/*
 * Used by the Docker build to populate the Gradle cache in a layer that only depends on the build
 * scripts. Without it, every source edit re-downloads the whole dependency graph.
 */
tasks.register('downloadDependencies') {
    description = 'Resolves compile and runtime dependencies so Docker can cache them in a layer.'
    group = 'build setup'
    def classpaths = [configurations.compileClasspath, configurations.runtimeClasspath]
    doLast {
        classpaths.each { it.resolve() }
    }
}
