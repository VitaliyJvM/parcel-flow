name: CI

# What this pipeline is for: proving that a clean checkout compiles, passes style, passes every
# test including the ones that start real PostgreSQL, Redpanda and Redis containers, and produces
# a runnable jar and a working image.
#
# What blocks a merge, and what does not:
#
#   build          BLOCKING   compile, Checkstyle, unit + integration tests, jar
#                  ADVISORY   ...plus a SonarQube Cloud step, see below
#   package        BLOCKING   Docker image builds (API + web UI), Compose validation, k6 parse
#   frontend       BLOCKING   Angular lint, unit tests (Vitest), production build
#   e2e            BLOCKING   OpenAPI snapshot vs live service; OIDC login/logout smoke test;
#                             Playwright against the real Compose stack (Keycloak included) +
#                             carrier simulator, signing in through the real Keycloak login form
#   dependencies   ADVISORY   OWASP Dependency-Check; only runs when an NVD_API_KEY secret exists
#
# The jobs are independent and run in parallel; none of them needs another's output. The frontend
# is built by npm only: it is deliberately not part of the Gradle build.
#
# Sonar is a step inside `build` rather than a job of its own. As a separate job it had to re-run
# `test jacocoTestReport` to produce the coverage XML the scanner reads, which meant a second full
# Testcontainers suite — Postgres, Redpanda and Redis — running concurrently with the first, to
# compute a report `build` had already computed. As a step it consumes the reports that are already
# on disk and runs `./gradlew sonar` alone.
#
# The advisory jobs and the advisory step use continue-on-error deliberately and say so in their own
# comments. Nothing that verifies correctness is allowed to be advisory.
#
# Credentials. The Compose stack refuses to start without a Keycloak client secret and local user
# passwords (docker-compose.yml uses `:?`). The jobs that start or validate it set the values below:
# throwaway, CI-only constants for a Keycloak that lives for the length of one job on one runner,
# bound to 127.0.0.1, holding no data. They are deliberately not repository secrets — a secret would
# imply they protect something. They protect nothing outside the runner and are used nowhere else.

on:
  push:
    branches: [ main, 'stage*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight. Two runs of a Testcontainers
# suite on the same branch tell you the same thing and cost twice as much.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Compile, style, tests, jar
    # ubuntu-latest ships a running Docker daemon, which is what Testcontainers needs. The tests
    # are not mocked: they start postgres:17-alpine, redpandadata/redpanda and redis:7-alpine.
    # Nothing extra has to be configured for that — no service containers, no DinD — because
    # Testcontainers talks to the host daemon over its socket.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Read by the Sonar step at the end of this job. SONAR_TOKEN is a secret because it
    # authenticates; the project key and organization are not secrets and are repository variables,
    # which are visible in logs and settable without rotating anything. Declared at job level
    # because GitHub evaluates a step's `if` before that step's own `env` block exists, so a
    # step-scoped variable cannot be used to guard the step that defines it.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Sonar's new-code detection needs history; a shallow clone makes every line look new and
          # attributes every existing issue to this run.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        # Caches the Gradle distribution, the dependency cache and the build cache, keyed on the
        # build scripts and lockfiles. (The brief asks for Maven caching; this project is Gradle,
        # so this is the equivalent.) Writes the cache only from the default branch, so a pull
        # request cannot poison it.
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile
        run: ./gradlew compileJava compileTestJava

      - name: Checkstyle
        # A separate step from the tests so a style failure is legible in the job list rather than
        # buried in a `build` task that also ran 226 tests.
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Tests
        # Unit and integration tests in one run: the integration tests are ordinary JUnit classes
        # that happen to start containers, not a separate source set, so splitting them would mean
        # starting the same containers twice.
        run: ./gradlew test

      - name: Coverage report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Package
        run: ./gradlew bootJar

      - name: SonarQube Cloud analysis
        # Last, so it analyses a tree that has already compiled, passed style, passed its tests and
        # produced a jar — and so the coverage XML it reads is the one the run above just wrote.
        #
        # `sonar` and nothing else. It has no task dependency on `test` or `jacocoTestReport`
        # (see the comment in build.gradle), so adding either here would re-run the whole
        # Testcontainers suite for a report that is already on disk.
        #
        # Skipped unless all three values are configured, so a fork — which receives neither
        # secrets nor variables — does not get a red step for a server it cannot authenticate
        # against. Advisory for the reason it always was: quality-gate thresholds nobody has tuned
        # are not a merge gate.
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        continue-on-error: true
        run: ./gradlew sonar

      - name: Upload test and coverage reports
        # always(), so a failing build still publishes the report that explains why. Without this
        # a red run tells you only that something failed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
            **/build/reports/jacoco/
          retention-days: 7

      - name: Upload jars
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jars
          path: '**/build/libs/*.jar'
          retention-days: 7

  package:
    name: Image, Compose and k6 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-only throwaway values; see "Credentials" at the top of this file.
    env:
      PARCELFLOW_OIDC_CLIENT_SECRET: ci-only-client-secret-not-a-real-secret
      PARCELFLOW_ADMIN_PASSWORD: ci-only-admin-password
      PARCELFLOW_RETAILER_PASSWORD: ci-only-retailer-password
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin-password

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the tracking-service image
        # Built, never pushed: there is no registry in this project. The point is that the
        # multi-stage Dockerfile still resolves and compiles, which a Gradle-only build does not
        # prove — the image builds from a different context and a different JDK image.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: tracking-service/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        # The nginx + Angular image, built from its own context (frontend/).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate the Compose file
        # Catches a malformed override, an undefined volume or a bad profile before someone
        # discovers it while trying to run the demo.
        run: docker compose config --quiet

      - name: Validate the k6 script
        # `k6 inspect` executes the script's init context and prints the resolved options, so a
        # syntax error or a bad scenario definition fails here rather than three minutes into a
        # load test.
        run: |
          docker run --rm -v "$PWD/performance/k6:/scripts:ro" grafana/k6:0.57.0 \
            inspect /scripts/parcelflow-load-test.js

  frontend:
    name: Frontend lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Contract snapshot is current
        # The committed TypeScript contracts must be exactly what the committed OpenAPI snapshot
        # generates. A hand edit, or a refreshed snapshot without regeneration, fails here.
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/core/api/generated

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CI-only throwaway values; see "Credentials" at the top of this file. Read by Compose (realm
    # import, tracking service) and by the Playwright login helper.
    env:
      PARCELFLOW_OIDC_CLIENT_SECRET: ci-only-client-secret-not-a-real-secret
      PARCELFLOW_ADMIN_PASSWORD: ci-only-admin-password
      PARCELFLOW_RETAILER_PASSWORD: ci-only-retailer-password
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin-password

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack
        # The tracking service, its dependencies, Keycloak and the web UI, exactly as a developer
        # runs them. The simulator image is built up front so the first test does not pay for it.
        run: |
          docker compose --profile simulator build tracking-service carrier-simulator frontend
          docker compose up -d --wait postgres redpanda redis keycloak tracking-service frontend

      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run e2e:install

      - name: OpenAPI snapshot matches the running service
        # The `frontend` job proves the generated TypeScript matches the committed snapshot; this
        # step proves the snapshot matches what the backend actually serves. Together they catch a
        # backend contract change that was not carried into the frontend.
        #
        # The service is healthy at this point (`up --wait` gates on its readiness probe, which
        # requires Flyway and the datasource). fetch-openapi.mjs writes canonical, key-sorted JSON,
        # so only a real contract change produces a diff, never springdoc ordering.
        working-directory: frontend
        env:
          OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
        run: |
          npm run api:fetch
          if ! git diff --exit-code -- openapi/tracking-service.openapi.json; then
            echo "::error file=frontend/openapi/tracking-service.openapi.json::The tracking service's OpenAPI document differs from the committed snapshot. Run 'npm run api:fetch && npm run api:generate' in frontend/ against the current backend and commit both files."
            exit 1
          fi

      - name: OIDC login and logout smoke test (curl, through nginx)
        # The real authorization code flow with no browser: BFF login endpoint, Keycloak's HTML
        # form, the callback, an authorized API call, an unauthorized one, RP-initiated logout.
        # A failure here points at configuration (issuer, redirect URIs, forwarded headers)
        # before Playwright's longer tests start.
        run: |
          jar="$(mktemp)"
          http_status='%{http_code}'
          scripts/oidc-login.sh http://localhost:8081 retailer.alpha PARCELFLOW_RETAILER_PASSWORD "$jar"
          test "$(curl -s -o /dev/null -w "$http_status" -b "$jar" http://localhost:8081/api/retailers/alpha-goods/shipments)" = 200
          test "$(curl -s -o /dev/null -w "$http_status" -b "$jar" http://localhost:8081/api/retailers/beta-supplies/shipments)" = 403
          test "$(curl -s -o /dev/null -w "$http_status" -b "$jar" http://localhost:8081/api/admin/failed-events)" = 403
          test "$(curl -s -o /dev/null -w "$http_status" http://127.0.0.1:8080/api/retailers/alpha-goods/shipments)" = 401
          token="$(curl -s -b "$jar" -c "$jar" http://localhost:8081/api/auth/csrf | jq -r .token)"
          end_session="$(curl -s -o /dev/null -w '%{redirect_url}' -b "$jar" -c "$jar" --data-urlencode "_csrf=$token" http://localhost:8081/logout)"
          case "$end_session" in http://localhost:8180/realms/parcelflow/protocol/openid-connect/logout?*) ;; *) echo "unexpected logout redirect"; exit 1 ;; esac
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -b "$jar" "$end_session")" = http://localhost:8081/signed-out
          test "$(curl -s -o /dev/null -w "$http_status" -b "$jar" http://localhost:8081/api/retailers/alpha-goods/shipments)" = 401
          rm -f "$jar"

      - name: Playwright
        # Against the nginx container, i.e. the production build and the production proxy rules.
        # localhost, not 127.0.0.1: the OIDC redirect URIs registered in Keycloak are exact.
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color tracking-service frontend keycloak | tail -n 600

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  dependencies:
    name: Dependency vulnerabilities (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ADVISORY, deliberately, and this is the documentation the brief asks for:
    #
    #   1. The NVD feed reports CVEs in transitive dependencies that a Spring Boot version bump
    #      resolves on Boot's own release schedule. Blocking merges on those would mean either
    #      pinning versions Boot has not adopted, or adding a suppression to get a green tick —
    #      and a suppression added under time pressure is never revisited.
    #   2. Dependency-Check's identification of shaded and relocated jars produces false positives
    #      at a rate that would train everyone to ignore the job.
    #
    # The report is published as an artifact and is meant to be read. If this project were
    # handling real customer data, the correct answer would be a blocking scan with a triaged
    # suppression file and an owner, not this.
    #
    # Every step is a no-op unless an NVD_API_KEY secret exists. This is not laziness, it is the
    # only configuration that terminates: without a key the NVD API allows 5 requests per rolling
    # 30 seconds, the seed of the vulnerability database is ~150 paged requests, and the run
    # exceeds any sane timeout. A timeout is a *cancellation*, actions/cache does not run its save
    # step on a cancelled job, so the cache below stays empty and the next run starts from zero
    # and dies in the same place. The job could never bootstrap itself. Skipping is honest;
    # a permanently cancelled check is not. The guard is on the steps rather than the job because
    # GitHub does not make the secrets context available to a job-level `if`.
    #
    # A key is free from https://nvd.nist.gov/developers/request-an-api-key — add it as the
    # repository secret NVD_API_KEY and this job starts running on its own.
    continue-on-error: true
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check out
        if: env.NVD_API_KEY != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        if: env.NVD_API_KEY != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: env.NVD_API_KEY != ''
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Cache the NVD database
        # Without this, every run re-downloads the whole vulnerability database, which takes tens
        # of minutes and hammers a public API. The key is unique per run so the entry is always
        # rewritten with the freshly-updated database; restore-keys pulls the most recent one.
        if: env.NVD_API_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload the report
        # always(), but only when the scan actually ran — an unconditional upload of a directory
        # that was never created fails the step and makes a skipped job look broken.
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          retention-days: 7

