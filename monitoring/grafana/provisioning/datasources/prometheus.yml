# Provisioned, not clicked. A datasource created through the UI lives in Grafana's SQLite volume
# and disappears with `docker compose down -v`, which makes "start the stack and look at the
# dashboard" a multi-step manual ritual instead of one command.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # The container name; Grafana reaches Prometheus over the Compose network, not via localhost.
    url: http://prometheus:9090
    isDefault: true
    uid: parcelflow-prometheus
    editable: false
    jsonData:
      # Matches the scrape interval, so Grafana's automatic step never asks for a resolution
      # Prometheus does not have.
      timeInterval: 5s
