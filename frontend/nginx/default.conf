# Serves the Angular build and forwards to the tracking service ONLY what the browser needs:
#
#   /api/                     the REST API (session cookie + CSRF header)
#   /oauth2/authorization/    start of the OIDC login: Spring Security redirects to Keycloak
#   /login/oauth2/code/       the OIDC callback: Spring Security exchanges the code server-side
#   /logout                   POST only: ends the session, then redirects to Keycloak's end-session
#
# Proxying the login flow through this origin is what makes the BFF work: the session cookie is
# set by, and only ever sent to, the origin the UI runs on, and the redirect_uri Keycloak sees is
# this origin's. /login and /signed-out are Angular routes and stay here.
#
# The tracking service also answers on /actuator/**, /internal/** (the load-test publisher, off by
# default), /v3/api-docs and /swagger-ui; none of those are proxied, and they are explicitly
# answered with 404 here so that a future catch-all proxy rule cannot expose them by accident.

# Docker's embedded DNS. Resolving per request (via the variable in proxy_pass) means nginx starts
# even if the backend is not up yet, and follows the container to a new IP after a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# The browser-facing port, taken from the Host header the browser sent ("localhost:8081"). nginx
# itself listens on 8080 inside the container, so $server_port would be wrong. The tracking
# service's RemoteIpValve needs it, together with X-Forwarded-Proto, to rebuild the URL the browser
# used: that is the base of the OIDC redirect_uri and the post-logout redirect.
map $http_host $forwarded_port {
    ~:(?<port>[0-9]+)$  $port;
    default             80;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The largest legitimate body is a shipment registration (a few hundred bytes).
    client_max_body_size 16k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Never proxied -------------------------------------------------------------------------
    location ^~ /internal/   { return 404; }
    location ^~ /actuator    { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui  { return 404; }

    # --- OIDC login flow (Spring Security) -------------------------------------------------------
    location ^~ /oauth2/authorization/ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/proxy-to-tracking-service.inc;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /login/oauth2/code/ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/proxy-to-tracking-service.inc;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # POST only. Spring Security's logout requires a CSRF token, so a GET could never log anyone
    # out anyway; refusing it here keeps the method surface obvious.
    location = /logout {
        limit_except POST { deny all; }
        include /etc/nginx/conf.d/proxy-to-tracking-service.inc;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # --- Public REST API -----------------------------------------------------------------------
    location ^~ /api/ {
        # The UI only ever sends GET and POST. Anything else is rejected before it reaches the
        # service. (Hygiene, not authorization: the service authorizes every request itself.)
        limit_except GET POST {
            deny all;
        }

        include /etc/nginx/conf.d/proxy-to-tracking-service.inc;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # --- Static assets -------------------------------------------------------------------------
    # favicon.ico is copied from public/ with its name unchanged (no content hash), so it must be
    # revalidated. An exact-match location wins over the regex below in nginx's matching order.
    location = /favicon.ico {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else matched here is content-hashed by the Angular build (main-*.js, chunk-*.js,
    # styles-*.css, media/*-<hash>.woff2), so it can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|ico|svg|png|webp)$ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- SPA fallback --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
