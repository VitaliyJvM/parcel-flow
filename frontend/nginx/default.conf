# Serves the Angular build and forwards ONLY the public REST API to the tracking service.
#
# Everything the browser needs is under /api/. The tracking service also answers on /actuator/**,
# /internal/** (the load-test publisher, off by default), /v3/api-docs and /swagger-ui; none of
# those are proxied, and they are explicitly answered with 404 here so that a future catch-all
# proxy rule cannot expose them by accident.

# Docker's embedded DNS. Resolving per request (via the variable in proxy_pass) means nginx starts
# even if the backend is not up yet, and follows the container to a new IP after a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The largest legitimate body is a shipment registration (a few hundred bytes).
    client_max_body_size 16k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Never proxied -------------------------------------------------------------------------
    location ^~ /internal/   { return 404; }
    location ^~ /actuator    { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui  { return 404; }

    # --- Public REST API -----------------------------------------------------------------------
    location ^~ /api/ {
        # The UI only ever sends GET and POST. Anything else is rejected before it reaches the
        # service. (This is a hygiene measure, not authorization: the API itself is open.)
        limit_except GET POST {
            deny all;
        }

        set $tracking_service http://tracking-service:8080;
        proxy_pass $tracking_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- Static assets -------------------------------------------------------------------------
    # favicon.ico is copied from public/ with its name unchanged (no content hash), so it must be
    # revalidated. An exact-match location wins over the regex below in nginx's matching order.
    location = /favicon.ico {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else matched here is content-hashed by the Angular build (main-*.js, chunk-*.js,
    # styles-*.css, media/*-<hash>.woff2), so it can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|ico|svg|png|webp)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- SPA fallback --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
