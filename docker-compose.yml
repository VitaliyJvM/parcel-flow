name: parcelflow

# The whole local environment: PostgreSQL, Redpanda, Redis, Keycloak, the tracking service, the
# Angular web UI, the carrier simulator, and the Prometheus + Grafana monitoring stack.
#
# First run: ./scripts/init-local-secrets.sh  (generates the Keycloak client secret and the local
# user passwords into the git-ignored .env; `docker compose` refuses to start without them).
#
# Localhost only. Every published port is bound to 127.0.0.1. The web UI and the API require an
# OIDC login, but the infrastructure around them does not (Redis, Redpanda, Grafana with anonymous
# Admin, Keycloak in development mode), so none of it may be reachable from the network the laptop
# is on. Containers still reach each other by service name on the Compose network; the bindings only
# affect the host side. See docs/security.md for what a real deployment needs on top of this.
#
# Two services sit behind profiles so `docker compose up` does not start them:
#
#   carrier-simulator   a one-shot CLI  ->  docker compose run --rm carrier-simulator ...
#   k6                  the load test   ->  docker compose --profile perf run --rm k6 run /scripts/...

services:

  postgres:
    image: postgres:17-alpine
    environment:
      # Defaults so a fresh clone runs with no setup; override any of them in a git-ignored `.env`,
      # which Compose reads automatically. See `.env.example`. The service below reads the same two
      # variables, so a changed password stays consistent on both sides.
      POSTGRES_DB: ${POSTGRES_DB:-parcelflow}
      POSTGRES_USER: ${POSTGRES_USER:-parcelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are required: without them pg_isready reports ready during the
      # brief window when the init scripts have not created the database yet.
      # $$ escapes the expansion for Compose, so the container's shell expands it, not Compose.
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redpanda:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      # Two listeners because containers and the host reach the broker by different names.
      # Kafka clients connect once to bootstrap, then reconnect to the addresses the broker
      # advertises — so a single listener advertising 'redpanda' would be unreachable from the
      # host, and one advertising 'localhost' would be unreachable from other containers.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API, from the host
      - "127.0.0.1:9644:9644"     # Redpanda admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  redis:
    image: redis:7-alpine
    # No persistence: everything in here is a derived copy of a PostgreSQL row with a TTL. Writing
    # an AOF or RDB would buy durability for data whose whole design assumption is that losing it
    # costs one database read.
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # The OpenID Provider for the web UI. Development mode, on purpose and only here: an in-container
  # H2 database, plain HTTP, and the realm re-imported from keycloak/realm/ whenever the container is
  # recreated, so the local identities are reproducible and disposable. It is NOT a production
  # Keycloak; docs/security.md lists what one needs.
  #
  # Hostnames. The browser reaches Keycloak at http://localhost:8180; the tracking service, inside
  # this network, at http://keycloak:8080. KC_HOSTNAME pins the issuer, the login page and the
  # end-session endpoint to the browser-facing URL, and KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets the
  # token, userinfo and JWKS endpoints answer on whichever host the request arrived at. Discovery
  # fetched over the internal name therefore still advertises the public issuer, which is what the
  # tracking service validates every ID token against. See DiscoveringClientRegistrationRepository.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [ "start-dev", "--import-realm" ]
    environment:
      # The master-realm admin console at http://localhost:8180/admin. Local only.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run ./scripts/init-local-secrets.sh}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into keycloak/realm/parcelflow-realm.json at import. Never committed.
      PARCELFLOW_OIDC_CLIENT_SECRET: ${PARCELFLOW_OIDC_CLIENT_SECRET:?run ./scripts/init-local-secrets.sh}
      PARCELFLOW_ADMIN_PASSWORD: ${PARCELFLOW_ADMIN_PASSWORD:?run ./scripts/init-local-secrets.sh}
      PARCELFLOW_RETAILER_PASSWORD: ${PARCELFLOW_RETAILER_PASSWORD:?run ./scripts/init-local-secrets.sh}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp is enough for the management port's
      # readiness endpoint.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    restart: unless-stopped

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      # started, not healthy. The service is designed to run without Redis, so gating startup on
      # the cache being up would contradict the design — and would turn a cache outage into an
      # outage of the whole service, which is exactly what the fallback exists to prevent.
      redis:
        condition: service_started
      # started, not healthy: the service resolves Keycloak lazily, on the first login. Until
      # Keycloak answers, login fails closed and everything else (health, Kafka) works.
      keycloak:
        condition: service_started
    environment:
      # Plain-HTTP localhost settings (non-Secure cookie, no HTTPS redirect). See
      # application-local.yml; everything else is the production configuration.
      SPRING_PROFILES_ACTIVE: local
      # The issuer as the browser sees it, and where this container fetches discovery from.
      PARCELFLOW_OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/parcelflow
      PARCELFLOW_OIDC_DISCOVERY_URI: http://keycloak:8080/realms/parcelflow/.well-known/openid-configuration
      PARCELFLOW_OIDC_CLIENT_SECRET: ${PARCELFLOW_OIDC_CLIENT_SECRET:?run ./scripts/init-local-secrets.sh}

      # Spring relaxed binding maps these onto spring.datasource.* and spring.kafka.*,
      # overriding the localhost defaults in application.yml.
      # Credentials are not in application.yml — that file is packaged into the jar — so they are
      # supplied here, from the same variables the postgres service above uses.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-parcelflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-parcelflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-parcelflow}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Structured JSON logs, one object per line, in Elastic Common Schema. Left unset in
      # application.yml so a local `bootRun` stays human-readable; on in Compose because this is
      # the environment that behaves like a deployment. Read them with:
      #   docker compose logs -f tracking-service | jq -r 'select(.correlationId) | ...'
      # Set to an empty value to get plain text back.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}

      # The load-testing publish endpoint. Off unless explicitly asked for:
      #   PARCELFLOW_LOAD_TESTING_ENABLED=true docker compose up -d --force-recreate
      # It writes raw events to the carrier events topic and exists only so the k6 scenario can
      # generate events at a rate a CLI cannot. Even enabled, it requires an ADMIN session and a
      # CSRF token like the rest of the API.
      #
      # The underscore between LOAD and TESTING matters. Relaxed binding has two different rules:
      # @ConfigurationProperties binding accepts the dash-removed form (PARCELFLOW_LOADTESTING_...),
      # but @ConditionalOnProperty resolves through the plain Environment, which maps a dash to an
      # underscore instead. The dash-removed spelling sets an environment variable that nothing
      # reads, the endpoint silently stays disabled, and the load test gets 404 on every publish.
      PARCELFLOW_LOAD_TESTING_ENABLED: ${PARCELFLOW_LOAD_TESTING_ENABLED:-false}
    ports:
      # Direct API access (Swagger UI, curl, the Angular dev proxy). The web UI does not need it:
      # it reaches the service over the Compose network through its own nginx. The API on this
      # port is exactly as protected as through nginx: same session, same CSRF, same roles.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Readiness, not liveness: this only reports healthy once Flyway has
      # migrated and the datasource is answering.
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Seven days is far more than a demo needs and costs nothing on a laptop; it means a load
      # test run yesterday is still there to compare against today's.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      # started, not healthy: Prometheus should be up and recording the target as DOWN while the
      # service starts. A monitoring system that waits for the thing it monitors cannot observe it
      # failing to start, which is exactly when you want it.
      tracking-service:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # Anonymous access with the Admin role. This is a local demo stack with no data worth
      # protecting and no ingress; requiring a login would only add a step between `up` and the
      # dashboard. Anything reachable from outside a laptop would not be configured this way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # Open straight on the provisioned dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/parcelflow-overview.json
      # No phoning home from a portfolio project.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  # The Angular web UI. nginx serves the static build and reverse-proxies /api/ and the three
  # Spring Security endpoints of the login flow (/oauth2/authorization/, /login/oauth2/code/,
  # /logout) to the tracking service, so the browser uses one origin, the session cookie is
  # first-party, and the backend needs no CORS configuration. It does not proxy /actuator,
  # /internal, /v3/api-docs or /swagger-ui (see frontend/nginx/default.conf).
  frontend:
    build:
      context: ./frontend
    environment:
      # Allowed as a form-action target in the CSP: logout is a form POST that the tracking service
      # answers with a redirect to Keycloak's end-session endpoint.
      OIDC_PROVIDER_ORIGIN: http://localhost:${KEYCLOAK_PORT:-8180}
    depends_on:
      # started, not healthy: nginx resolves the backend per request, so the UI can come up first
      # and show "service unreachable" rather than not existing at all.
      tracking-service:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    restart: unless-stopped

  # The load test. A profile, because it runs to completion and must not be started by `up`.
  #
  #   PARCELFLOW_LOAD_TESTING_ENABLED=true docker compose up -d --force-recreate tracking-service
  #   docker compose --profile perf run --rm k6 run /scripts/parcelflow-load-test.js
  #
  # Running it in a container rather than from a local k6 install means the numbers come from the
  # same generator on any machine, and that nobody has to install k6 to reproduce them.
  k6:
    profiles: [ "perf" ]
    image: grafana/k6:0.57.0
    volumes:
      - ./performance/k6:/scripts:ro
      - ./performance/results:/results
    environment:
      # Reaches the service over the Compose network, so the measurement does not include the
      # host's port-forwarding hop.
      BASE_URL: ${BASE_URL:-http://tracking-service:8080}
      SHIPMENT_COUNT: ${SHIPMENT_COUNT:-200}
      VIRTUAL_USERS: ${VIRTUAL_USERS:-20}
      TEST_DURATION: ${TEST_DURATION:-2m}
      EVENT_RATE: ${EVENT_RATE:-200}
      EVENTS_PER_REQUEST: ${EVENTS_PER_REQUEST:-10}
      DUPLICATE_PERCENTAGE: ${DUPLICATE_PERCENTAGE:-10}
      OUT_OF_ORDER_PERCENTAGE: ${OUT_OF_ORDER_PERCENTAGE:-10}
      K6_SUMMARY_EXPORT: ${K6_SUMMARY_EXPORT:-}
    depends_on:
      tracking-service:
        condition: service_healthy
    restart: "no"

  # A one-shot CLI, not a long-running service. It sits behind a profile so that
  # `docker compose up` does not start it, run it to completion, and then restart it forever.
  #
  #   docker compose run --rm carrier-simulator \
  #     --shipment-id=<uuid> --tracking-number=SP123456 --carrier=SWIFTPOST --scenario=NORMAL
  carrier-simulator:
    profiles: [ "simulator" ]
    build:
      context: .
      dockerfile: carrier-simulator/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    restart: "no"

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
